driver:
  # Prozess, der einen Seed (long) über STDOUT zurückliefert. Passe den Pfad auf deinen
  # SubQG/Mycel-Treiber an. Leer lassen, um direkt auf kryptografisch sichere Seeds
  # zu fallen.
  command: ""
  # Für den ersten Aufruf (Kernel-Warmup) kann ein höheres Timeout nötig sein.
  timeoutSeconds: 60

world:
  # Empfohlene Blöcke für Mycelia-Feeling
  baseBlock: DEEPSLATE
  surfaceBlock: MYCELIUM
  seaLevel: 45
  # Ein kleinerer Wert macht die Berge massiver, 
  # ein größerer (0.05+) macht die Welt zerklüfteter.
  scale: 0.025
